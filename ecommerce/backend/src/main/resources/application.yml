# 기본(dev) 프로파일: 로컬 PostgreSQL 사용
spring:
  application:
    name: ecommerce
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: ecommerce
    password: ecommerce
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 로컬 개발 편의를 위해 스키마 자동 갱신(운영 전환 시 Flyway 등으로 대체 권장)
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    # Jackson 3 은 날짜/시간을 기본적으로 ISO 8601 문자열로 직렬화한다(예: 2026-07-20T10:00:00Z).
    # null 필드도 응답에 포함(details/payment/paidAt 등 계약이 null 을 명시하는 필드 보존)
    default-property-inclusion: always

server:
  port: 8080

# JWT 설정 (운영에서는 환경변수 등으로 주입 권장)
app:
  jwt:
    secret: ${JWT_SECRET:change-this-in-production-please-use-a-long-random-secret-key-0123456789}
    expiration-ms: 86400000 # 24시간

logging:
  level:
    org.hibernate.SQL: debug
