# 로컬 개발용 PostgreSQL.
# 접속 정보는 backend/src/main/resources/application.yml 의 dev 데이터소스와 동일하게 맞춘다.
# (url: jdbc:postgresql://localhost:5432/ecommerce, user/password: ecommerce/ecommerce)
services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - ecommerce-pgdata:/var/lib/postgresql/data
    healthcheck:
      # 애플리케이션이 붙기 전에 DB가 실제로 질의를 받을 수 있는지 확인한다.
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ecommerce-pgdata:
